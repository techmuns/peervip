name: Test credentials

# Manual pre-flight: validate Bedrock + Screener creds BEFORE running a real
# research job. Prints a reply from Bedrock and a few scraped metrics from
# Screener. No commits, no writes.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright + cheerio
        run: |
          npm install playwright@1 cheerio@1 --no-save
          npx playwright install --with-deps chromium

      - name: Test Bedrock
        env:
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          BEDROCK_REGION: ${{ secrets.BEDROCK_REGION }}
          BEDROCK_MODEL_IDS: ${{ secrets.BEDROCK_MODEL_IDS }}
        run: node scripts/test-bedrock.mjs

      - name: Test Screener
        env:
          SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
        run: node scripts/test-screener.mjs

      - name: Test global (Yahoo)
        run: node scripts/test-global.mjs
