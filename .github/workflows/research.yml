name: Research peers

# Fired by the /api/research Pages Function (workflow_dispatch). Runs the
# Screener + global + Bedrock pipeline, writes public/data/reports/<slug>.json +
# index.json, and commits them (durable cache; Pages redeploys). The pipeline
# also POSTs the report to /api/progress so KV serves it instantly.
on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Company or industry to research (e.g. "Stylam" or "laminates")'
        required: true
      slug:
        description: 'Slug (the Function passes this; leave blank to derive from query)'
        required: false
        default: ''
      mode:
        description: 'full = rebuild from scratch; update = additive top-up (reuse the set, refresh numbers, union new finds)'
        required: false
        default: 'full'

permissions:
  contents: write

# Serialize commits so parallel research runs never race on index.json.
concurrency:
  group: peervip-data-commit
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright + cheerio
        run: |
          npm install playwright@1 cheerio@1 --no-save
          npx playwright install --with-deps chromium

      - name: Run research pipeline
        env:
          QUERY: ${{ inputs.query }}
          SLUG: ${{ inputs.slug }}
          MODE: ${{ inputs.mode }}
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          BEDROCK_REGION: ${{ secrets.BEDROCK_REGION }}
          BEDROCK_MODEL_IDS: ${{ secrets.BEDROCK_MODEL_IDS }}
          SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          PROGRESS_URL: ${{ secrets.PROGRESS_URL }}
          PROGRESS_SECRET: ${{ secrets.PROGRESS_SECRET }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node scripts/research-peers.mjs

      - name: Commit report + index
        env:
          DEFAULT_BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/reports/*.json public/data/index.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: research peers for \"${{ inputs.query }}\""

          # Push with up to 4 attempts, rebasing on the remote between tries
          # (another run may have committed to the branch while we ran).
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${DEFAULT_BRANCH}"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — fetch + rebase + retry..."
            git fetch origin "${DEFAULT_BRANCH}"
            git rebase "origin/${DEFAULT_BRANCH}" || { echo "Rebase failed."; git rebase --abort || true; exit 1; }
            sleep $((attempt * 2))
          done
          echo "Push still failing after 4 attempts."
          exit 1
